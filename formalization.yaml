    authors: [Stephanie Alexander]
    type: original-proof
    relationship: other
    location: README.md
    note: Trace reduction, score-set stabilization, attaining frames, and the quantitative multiplicity penalty.
  - title: Two subspaces
    authors: [P. R. Halmos]
    type: paper
    relationship: background
    author_endorsement: not-contacted
    id: https://doi.org/10.1090/S0002-9947-1969-0251519-5
    note: Theorem 2 gives the classical two-projection geometry behind the positive square-root frame.
  - title: "Ladder proof of nonlocality without inequalities: theoretical and experimental results"
    authors: [D. Boschi, S. Branca, F. De Martini, L. Hardy]
    type: paper
    relationship: background
    author_endorsement: not-contacted
    id: https://doi.org/10.1103/PhysRevLett.79.2755
