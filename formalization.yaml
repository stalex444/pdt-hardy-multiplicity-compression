    authors: [José L. Cereceda]
    type: paper
    relationship: background
    author_endorsement: not-contacted
    id: https://doi.org/10.1088/0305-4470/35/43/309
    note: Equations (18) and (19) give the optimizing measurement angle and probability at a fixed two-qubit Schmidt ratio.
  - title: Nonlocality without inequalities for almost all entangled states of any quantum system
    authors: [GianCarlo Ghirardi, Luca Marinatto]
    type: paper
    relationship: background
    author_endorsement: not-contacted
    id: https://doi.org/10.1103/PhysRevA.72.014105
    note: Constructs a Hardy witness on two unequal Schmidt amplitudes of a higher-dimensional state and evaluates its success in Eq. (26).
  - title: "Specker’s parable of the overprotective seer: A road to contextuality, nonlocality and complementarity"
    authors: [Yeong-Cherng Liang, Robert W. Spekkens, Howard M. Wiseman]
    type: paper
    relationship: background
    author_endorsement: not-contacted
    id: https://doi.org/10.1016/j.physrep.2011.05.001
    note: Section IV.E reports a numerical upper bound of 0.17456 for the three-setting ladder and raises the question of two-qubit sufficiency.
  - title: Hardy-type paradoxes for an arbitrary symmetric bipartite Bell scenario
    authors: [Kai-Siang Chen, Shiladitya Mal, Gelo Noel M. Tabia, Yeong-Cherng Liang]
    type: paper
    relationship: background
    author_endorsement: not-contacted
    id: https://doi.org/10.1103/PhysRevA.109.042206
    note: Table I(a), Boschi row with three binary settings per party, reports numerical lower and upper bounds of 0.17455 and 0.17459 for the state-optimized problem.
