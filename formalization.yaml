    relationship: builds-on
    note: The two-qubit ladder supplies the two-step plastic-constant optimum used in the multiplicity bound through the four-level theorem.
  - id: https://palomar-registry.org/entry.html?id=PALOMAR-2026-11-21-000002
    relationship: builds-on
    note: The proof imports HardyBornBridge.gram_residual_le_matching and HardyFourPairing.matchingMax_le_plastic at commit c9946d77c639d89bee866ae19a47f3f5bc0fcb7f.
  - id: https://palomar-registry.org/entry.html?id=PALOMAR-2026-11-23-000030
    relationship: other
    note: Companion result on preparing the Hardy-optimal two-qubit spectrum with a quartic gate.
  - id: https://palomar-registry.org/entry.html?id=PALOMAR-2026-11-23-000034
    relationship: other
    note: Companion five-level result on real measurements and exact matching for spectra proportional to (s,2,3,4,5) with 0<s≤2. The present fixed-state maximum treats two exceptional amplitudes with arbitrary background multiplicity of at least two.
status:
  scope: Positive finite Schmidt amplitudes with a flat background. The normalized two-exception Hardy objective allows every complex terminal rank and every positive pair of amplitude ratios.
