fidelity:
  divergences: >-
    The kernel statements directly use the compressed-moment terminal objective.
    The previously established reduction from the original five-zero binary
    experiment and rescaling to an arbitrary common background are explained
    in the written proof. The independent numerical tests use orthogonal
    projections. The five-distinct-amplitude pairing conjecture is outside
    these statements.
