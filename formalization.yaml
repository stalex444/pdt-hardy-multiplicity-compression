version: v0.4
project:
  name: Repeated Schmidt Levels in the Hardy Ladder
  description: >-
    An orthonormal terminal frame with k exceptional Schmidt amplitudes has a
    replacement on 2k coordinates preserving all positive exceptional spectra
    and all pairs of power-residual exponents simultaneously. With at least k
    background copies the unnormalized score set stabilizes. For two exceptional
    amplitudes this gives the attained fixed-state two-step Hardy maximum and
    an explicit loss below the plastic ceiling for every extra background copy.
  authors: [Stephanie Alexander]
  responsible_maintainers: [Stephanie Alexander]
  license: MIT
repository:
  role: substantive-development
classification:
  arxiv: [quant-ph, math.OC]
  msc2020: [81P45, 15A60]
